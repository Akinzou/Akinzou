<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Wiktor Jeleń — Backend &amp; Platform Engineer</title>
<desc id="desc">Terminal-style banner: Wiktor Jeleń, backend and platform engineer in Cracow, Poland. Builds multi-tenant platforms, workflow orchestration, LLM integration and CI/CD. Open to new roles: root@yelon.dev</desc>
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#bf00ff"/><stop offset="1" stop-color="#ff00a0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07070d" stop-opacity="0"/><stop offset="1" stop-color="#07070d" stop-opacity="1"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="1200" height="470" rx="18"/></clipPath>
  <style>
    .mono{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace;}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes hide{from,to{opacity:0}}
    @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(470px)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .cursor{animation:hide 7.0s, blink 1s step-end 7.0s infinite}
    .scan{animation:scan 7s linear infinite}
    .rise{animation:rise .8s ease-out .1s backwards}
    .t0{animation:type 0.6s steps(11,end) 0.6s backwards}.t1{animation:type 1.4s steps(72,end) 1.3s backwards}.t2{animation:type 0.6s steps(11,end) 2.9s backwards}.t3{animation:type 1.4s steps(74,end) 3.4s backwards}.t4{animation:type 0.6s steps(12,end) 5.0s backwards}.t5{animation:type 1.3s steps(68,end) 5.7s backwards}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.scan{display:none}}
  </style>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="470" fill="#07070d"/>
  <g stroke="#1c1c30" stroke-width="1" opacity="0.55"><line x1="0" y1="0" x2="0" y2="470"/><line x1="40" y1="0" x2="40" y2="470"/><line x1="80" y1="0" x2="80" y2="470"/><line x1="120" y1="0" x2="120" y2="470"/><line x1="160" y1="0" x2="160" y2="470"/><line x1="200" y1="0" x2="200" y2="470"/><line x1="240" y1="0" x2="240" y2="470"/><line x1="280" y1="0" x2="280" y2="470"/><line x1="320" y1="0" x2="320" y2="470"/><line x1="360" y1="0" x2="360" y2="470"/><line x1="400" y1="0" x2="400" y2="470"/><line x1="440" y1="0" x2="440" y2="470"/><line x1="480" y1="0" x2="480" y2="470"/><line x1="520" y1="0" x2="520" y2="470"/><line x1="560" y1="0" x2="560" y2="470"/><line x1="600" y1="0" x2="600" y2="470"/><line x1="640" y1="0" x2="640" y2="470"/><line x1="680" y1="0" x2="680" y2="470"/><line x1="720" y1="0" x2="720" y2="470"/><line x1="760" y1="0" x2="760" y2="470"/><line x1="800" y1="0" x2="800" y2="470"/><line x1="840" y1="0" x2="840" y2="470"/><line x1="880" y1="0" x2="880" y2="470"/><line x1="920" y1="0" x2="920" y2="470"/><line x1="960" y1="0" x2="960" y2="470"/><line x1="1000" y1="0" x2="1000" y2="470"/><line x1="1040" y1="0" x2="1040" y2="470"/><line x1="1080" y1="0" x2="1080" y2="470"/><line x1="1120" y1="0" x2="1120" y2="470"/><line x1="1160" y1="0" x2="1160" y2="470"/><line x1="1200" y1="0" x2="1200" y2="470"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/></g>
  <rect y="310" width="1200" height="160" fill="url(#fade)"/>
  <rect class="scan" width="1200" height="60" fill="#00f0ff" opacity="0.035"/>

  <!-- title bar -->
  <rect width="1200" height="40" fill="#0d0d18"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#1c1c30"/>
  <circle cx="26" cy="20" r="6.5" fill="#ff5f57"/><circle cx="48" cy="20" r="6.5" fill="#febc2e"/><circle cx="70" cy="20" r="6.5" fill="#28c840"/>
  <text x="600.0" y="26" text-anchor="middle" class="mono" font-size="14" fill="#5b5b7a">yelon@cracow: ~</text>

  <!-- name -->
  <g class="rise">
    <text x="62" y="128" class="mono" font-size="66" font-weight="800" fill="url(#neon)" filter="url(#glow)" letter-spacing="2">WIKTOR JELEŃ</text>
    <text x="66" y="172" class="mono" font-size="20" fill="#00f0ff" letter-spacing="5">BACKEND &amp; PLATFORM ENGINEER</text>
    <text x="66" y="202" class="mono" font-size="15" fill="#5b5b7a" letter-spacing="1">TypeScript · Python · PostgreSQL · Temporal · LLM integration · CI/CD</text>
  </g>
  <g opacity="0.85"><text x="760" y="96" class="mono" font-size="18" fill="url(#neon)" xml:space="preserve">__   __ _____ _      ___  _   _ </text><text x="760" y="118" class="mono" font-size="18" fill="url(#neon)" xml:space="preserve">\ \ / /| ____| |    / _ \| \ | |</text><text x="760" y="140" class="mono" font-size="18" fill="url(#neon)" xml:space="preserve"> \ V / |  _| | |   | | | |  \| |</text><text x="760" y="162" class="mono" font-size="18" fill="url(#neon)" xml:space="preserve">  | |  | |___| |___| |_| | |\  |</text><text x="760" y="184" class="mono" font-size="18" fill="url(#neon)" xml:space="preserve">  |_|  |_____|_____|\___/|_| \_|</text></g>
  <text x="762" y="222" class="mono" font-size="14" fill="#5b5b7a">jeleń = deer · yelon.dev</text>

  <text x="64" y="250" class="mono t0" font-size="19"><tspan fill="#bf00ff">~ $ </tspan><tspan fill="#d8d8ee">cat ./about</tspan></text><text x="64" y="280" class="mono t1" font-size="19"><tspan fill="#3a3a55">  › </tspan><tspan fill="#00f0ff">production backends · multi-tenant platforms · security-critical systems</tspan></text><text x="64" y="310" class="mono t2" font-size="19"><tspan fill="#bf00ff">~ $ </tspan><tspan fill="#d8d8ee">ls ./builds</tspan></text><text x="64" y="340" class="mono t3" font-size="19"><tspan fill="#3a3a55">  › </tspan><tspan fill="#00ff9d">multi-tenant-platforms/  workflow-orchestration/  llm-integration/  ci-cd/</tspan></text><text x="64" y="370" class="mono t4" font-size="19"><tspan fill="#bf00ff">~ $ </tspan><tspan fill="#d8d8ee">cat ./status</tspan></text><text x="64" y="400" class="mono t5" font-size="19"><tspan fill="#3a3a55">  › </tspan><tspan fill="#ff00a0">open to new roles · backend / platform / automation · root@yelon.dev</tspan></text>
  <text x="64" y="430" class="mono" font-size="19" fill="#bf00ff">~ $ </text>
  <rect class="cursor" x="112" y="413" width="11" height="21" fill="#00ff9d"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="469" rx="18" fill="none" stroke="#1c1c30"/>
</svg>
